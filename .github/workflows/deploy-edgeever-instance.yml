name: Deploy EdgeEver Instance

# 按上游标准方式部署实例：
#   bun install --frozen-lockfile → bun run build → bun run build:worker → wrangler deploy
# 绑定通过 EDGE_EVER_* 环境变量注入（上游 run-wrangler.mjs 原生支持），
# 不依赖 Cloudflare 控制台里的构建配置，因此不会被上游同步覆盖。
#
# 只手动触发。
# 上游同步（Update deployed EdgeEver）只负责把代码更新到 main 分支，
# 不会自动部署到这里；部署由用户在 Actions 页面手动点 Run workflow 决定时机。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 目标实例
        required: true
        default: edgeever-v3
        type: choice
        options:
          - edgeever-v3

permissions:
  contents: read

concurrency:
  group: edgeever-instance-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: d2a9abecb37b836f0c4e4c586ca1b11d
      CLOUDFLARE_API_TOKEN: ${{ secrets.EDGE_EVER_DEPLOY_TOKEN }}
      EDGE_EVER_WORKER_NAME: ${{ inputs.target || 'edgeever-v3' }}
      # 亚太资源（已建好并迁完全部数据，见交付说明）
      EDGE_EVER_D1_DATABASE_NAME: edgeever-apac
      EDGE_EVER_D1_DATABASE_ID: e456c7ee-db24-4ce5-83da-39cda00de18a
      EDGE_EVER_R2_BUCKET_NAME: edgeever-resources-apac
      EDGE_EVER_AUTH_USERNAME: admin
      EDGE_EVER_AUTH_PASSWORD: ${{ secrets.EDGE_EVER_AUTH_PASSWORD }}
      EDGE_EVER_SESSION_TTL_DAYS: "30"
      EDGE_EVER_DEPLOYMENT_METHOD: github_actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 同步工作流刚推的提交可能还没成为默认分支 HEAD，显式取 main
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 每次升级上游版本都可能带来新的 D1 迁移。若只部署代码不迁移 schema，
      # API 会因缺列/缺表返回 503 database_not_ready，客户端表现为只能看到
      # 本地缓存的一两条笔记、新建笔记无法同步。必须先迁移再部署。
      - name: Apply D1 migrations
        run: bun run db:migrate:remote

      - name: Build web assets
        run: bun run build

      - name: Build worker bundle
        run: bun run build:worker

      - name: Deploy worker
        run: bun scripts/run-wrangler.mjs deploy

      - name: Verify deployment
        run: |
          set -euo pipefail
          base="https://${EDGE_EVER_WORKER_NAME}.zhangxiaonan1986.workers.dev"
          echo "检查 ${base}"
          for path in /api/health /api/openapi.json; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${base}${path}" || true)"
            echo "  ${path} -> ${code}"
          done
          # schema 未就绪时接口会返回 503 database_not_ready，直接让流水线失败，
          # 避免"部署成功但客户端同步全挂"这种静默故障。
          body="$(curl -s --max-time 25 "${base}/api/v1/auth/session" || true)"
          echo "  /api/v1/auth/session -> ${body:0:200}"
          if printf '%s' "$body" | grep -q "database_not_ready"; then
            echo "::error::D1 schema 未就绪，请检查 Apply D1 migrations 步骤"
            exit 1
          fi
